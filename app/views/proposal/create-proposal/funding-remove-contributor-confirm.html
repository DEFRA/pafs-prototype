{% extends "layouts/main.html" %}
{% set pageName="Are you sure you want to remove " + contributorName + "?" %}
{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <a href="{{ backLink }}" class="govuk-back-link">Back</a>

    <form method="post" action="{{ actionUrl }}" novalidate>
      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <h1 class="govuk-fieldset__heading">
              Are you sure you want to remove {{ contributorName }}?
            </h1>
          </legend>

          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="confirm-remove-yes" name="confirm-remove" type="radio" value="yes">
              <label class="govuk-label govuk-radios__label" for="confirm-remove-yes">
                Yes
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="confirm-remove-no" name="confirm-remove" type="radio" value="no">
              <label class="govuk-label govuk-radios__label" for="confirm-remove-no">
                No
              </label>
            </div>
          </div>
        </fieldset>
      </div>

      <button class="govuk-button" type="submit" data-module="govuk-button">
        Continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
