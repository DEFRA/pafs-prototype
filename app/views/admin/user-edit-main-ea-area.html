{% extends "layouts/main.html" %}

{% set pageName="Change main EA area" %}

{% block beforeContent %}
  <a href="/admin/users/{{ data.currentUser.id }}/edit-details" class="govuk-back-link">Back</a>
{% endblock %}

{% block content %}

    <h1 class="govuk-heading-l">
      Change the user's main EA area
    </h1>

    <form method="post" action="/admin/users/{{ data.currentUser.id }}/edit-main-ea-area" novalidate>

      <div class="govuk-form-group">
        <label class="govuk-label govuk-label--m" for="main-ea-area">
          Main EA area
        </label>
        <div id="mainArea-hint" class="govuk-hint">This will be the user's primary area</div>
        <select class="govuk-select" id="main-ea-area" name="mainArea">
          <option value="">Select an area</option>
          {% for area in data.areasData.ea_areas or [] %}
            <option value="{{ area.id }}" {{ 'selected' if data.currentUser.mainArea == area.id }}>{{ area.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="govuk-button-group">
        <button type="submit" class="govuk-button" data-module="govuk-button">
          Continue
        </button>
        <a href="/admin/users/{{ data.currentUser.id }}/view" class="govuk-link">Cancel</a>
      </div>
    </form>

  </div>
</div>

{% endblock %}
