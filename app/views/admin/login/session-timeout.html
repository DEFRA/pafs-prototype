{% extends "layouts/main.html" %}

{% set pageName="Admin Login" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    
    {{ govukNotificationBanner({
      type: "important",
      html: "<p class=\"govuk-notification-banner__heading\">Your session expired. Please sign in again to continue.</p>"
    }) }}

    <h1 class="govuk-heading-xl">
      Sign in
    </h1>

    <form action="/admin/login" method="post" novalidate>
      
      <div class="govuk-form-group">
        <label class="govuk-label" for="email">
          Email address
        </label>
        <input class="govuk-input" id="email" name="email" type="email" autocomplete="email">
      </div>

      <div class="govuk-form-group">
        <label class="govuk-label" for="password">
          Password
        </label>
        <input class="govuk-input" id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <button type="submit" class="govuk-button" data-module="govuk-button">
        Sign in
      </button>

    </form>
  </div>
</div>

{% endblock %}
