{% extends "layouts/general-variant1.html" %}

{% set pageName = "Sign in" %}

{% block content %}

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <h1 class="govuk-heading-xl">
      Sign in
    </h1>

      <form action="/general/login" method="post" novalidate>

        <div class="govuk-form-group">
          <label class="govuk-label" for="email">
          Email address
        </label>
          <input class="govuk-input" id="email" name="email" type="email" autocomplete="email">
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label" for="password">
          Password
        </label>
          <input class="govuk-input" id="password" name="password" type="password" autocomplete="current-password">
        </div>

        <button type="submit" class="govuk-button" data-module="govuk-button">
        Sign in
      </button>

      </form>

      <p class="govuk-body govuk-!-margin-top-6">
        <a href="/general/forgot-password" class="govuk-link">I have forgotten my password</a>
      </p>

      <p class="govuk-body">
        <a href="/general/request-account" class="govuk-link">Request an account</a>
      </p>

    </div>
  </div>

{% endblock %}
